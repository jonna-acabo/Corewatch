system {
    host-name r2;
    services {
        ssh { root-login deny; }
        netconf { ssh; }
    }
    login { message "Authorised access only. All activity is logged and monitored."; }
    ntp { server 10.250.0.11; server 10.250.0.12; }
}
interfaces {
    ge-0/0/0 {
        description "CORE | r1 ge-0/0/0";
        unit 0 { family inet { address 10.0.0.1/31; } }
    }
    lo0 { unit 0 { family inet { address 10.255.0.2/32; } } }
}
routing-options { router-id 10.255.0.2; autonomous-system 64510; }
protocols {
    ospf { area 0.0.0.0 { interface ge-0/0/0.0 { interface-type p2p; } interface lo0.0 { passive; } } }
    bgp {
        group IBGP { type internal; local-address 10.255.0.2; neighbor 10.255.0.1; }
    }
    lldp { interface all; }
}
