system {
    host-name r1;
    services {
        ssh { root-login deny; }
        netconf { ssh; }
    }
    login { message "Authorised access only. All activity is logged and monitored."; }
    ntp { server 10.250.0.11; server 10.250.0.12; }
}
interfaces {
    ge-0/0/0 {
        description "CORE | r2 ge-0/0/0";
        unit 0 { family inet { address 10.0.0.0/31; } }
    }
    ge-0/0/1 {
        description "TRANSIT | Tidegate Transit AS64496 | CID TDG-LAB-0001";
        unit 0 { family inet { address 192.0.2.2/30; } }
    }
    lo0 { unit 0 { family inet { address 10.255.0.1/32; } } }
}
routing-options { router-id 10.255.0.1; autonomous-system 64510; }
protocols {
    ospf { area 0.0.0.0 { interface ge-0/0/0.0 { interface-type p2p; } interface lo0.0 { passive; } } }
    bgp {
        group IBGP { type internal; local-address 10.255.0.1; neighbor 10.255.0.2; }
        group TRANSIT-TIDEGATE { type external; peer-as 64496; neighbor 192.0.2.1; }
    }
    lldp { interface all; }
}
